<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="cookieGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8B5"/>
      <stop offset="50%" stop-color="#EEB960"/>
      <stop offset="85%" stop-color="#D0882C"/>
      <stop offset="100%" stop-color="#99530A"/>
    </linearGradient>
    <linearGradient id="innerShadowRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.35)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </linearGradient>
  </defs>
  <!-- Outer Curve & Fold Body -->
  <path class="cookie-body" d="M 100 25 C 150 25, 180 65, 175 125 C 172 160, 135 178, 100 178 Z" fill="url(#cookieGradRight)" />
  <!-- Shadow creases -->
  <path class="cookie-fold" d="M 100 25 C 125 70, 145 120, 100 178 Z" fill="url(#innerShadowRight)" opacity="0.7"/>
  <!-- Texture Highlights -->
  <path d="M 160 70 Q 170 110 150 145" fill="none" stroke="#FFF0C4" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
  <path d="M 135 50 Q 145 90 125 160" fill="none" stroke="#FFE49E" stroke-width="2.5" opacity="0.5" stroke-linecap="round"/>
</svg>
